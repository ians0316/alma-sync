# Makes a GitHub release whenever a version tag like v1.0.0 is pushed.
# Release titles are just the version.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/ians0316/alma-sync/releases/latest
    steps:
      - uses: actions/checkout@v4
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          # keep every release title as just its version
          gh release list --limit 100 --json tagName,name \
            -q '.[] | select(.name != .tagName) | .tagName' |
            while read -r t; do gh release edit "$t" --title "$t"; done
