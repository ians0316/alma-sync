# One-time: posts the starter issues, then this file is deleted.
name: Create starter issues
on:
  push:
    branches: [main]
    paths: [.github/workflows/create-issues.yml]
permissions:
  issues: write
jobs:
  issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          make() {
            if gh issue list --state all --search "\"$1\" in:title" --json title -q '.[].title' | grep -Fxq "$1"; then
              echo "exists: $1"; return; fi
            gh issue create --title "$1" --label "$2" --body "$3"
          }
          make "Notification when a new grade is posted" "enhancement" "After each sync, show a Mac/Windows notification when Alma has a new or changed grade.

          - Say the class and assignment name.
          - On/off setting in config.json."
          make "Warn if the sync hasn't worked for a day" "good first issue" "If the last successful sync was more than 24 hours ago (for example, the Alma login expired), show a notification and write a clear line in sync.log."
          make "Grade history chart in Google Sheets" "enhancement" "Keep a history of each class's grade over the semester and add a line chart to the Grades sheet."
          make "One-step installer" "enhancement" "Replace the several setup commands with one script that installs packages, saves passwords, and sets up the hourly job and the Alma+ task bridge."
