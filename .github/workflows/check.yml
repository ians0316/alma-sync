# Checks every push for Python files that don't compile.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # each push to main shows under Deployments as "main", pull requests as "preview"
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'main' }}
      url: https://github.com/ians0316/alma-sync/commit/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python has no syntax errors
        run: python -m compileall -q alma_sync windows
